# EditMode tests on every push.
#
# Unity refuses to activate headless without a license, so the test step is gated on the secret being
# configured instead of the whole job: a job-level `if: secrets.X != ''` is not allowed (the secrets
# context is unavailable there) and made the workflow fail before any job was created.
#   gh secret set UNITY_LICENSE --body "<contents of Unity_lic.ulf>"
#
# unityVersion: auto reads ProjectSettings/ProjectVersion.txt, so this file never drifts from the editor.
name: editmode-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  editmode:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check for a Unity license
        id: license
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE is not set, skipping the test run."
          fi

      - name: Cache Library
        if: steps.license.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-

      - name: Run EditMode tests
        if: steps.license.outputs.present == 'true'
        uses: game-ci/unity-test-runner@v4
        with:
          unityVersion: auto
          testMode: EditMode
          artifactsPath: TestResults
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results

      - name: Upload results
        if: always() && steps.license.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: editmode-results
          path: TestResults
          if-no-files-found: warn
