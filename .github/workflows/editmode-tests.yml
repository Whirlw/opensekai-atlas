# EditMode tests on every push. The job is skipped until a Unity license is configured, because
# Unity refuses to activate headless without one:
#   gh secret set UNITY_LICENSE --body "<contents of Unity_lic.ulf>"
#
# The project is licensed for Unity 6000.6.7f1; keep the image tag in sync with ProjectVersion.txt.
name: editmode-tests

on:
  push:
    branches: [main, codex/player-lite-refactor]
  pull_request:

jobs:
  editmode:
    if: ${{ secrets.UNITY_LICENSE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.7f1
          testMode: EditMode
          artifactsPath: TestResults
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-results
          path: TestResults
